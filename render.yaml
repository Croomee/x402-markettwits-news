services:
  - type: web
    name: x402-news
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PAY_TO_ADDRESS
        sync: false
      - key: X402_NETWORK
        value: eip155:8453
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: PRICE
        value: "$0.003"
      - key: INGEST_TOKEN
        generateValue: true
      - key: PROXY_URL
        sync: false
      - key: PROXY_SCOPE
        value: wb,ozon
      - key: PROXY_FALLBACK_DIRECT
        value: "true"
      # Headless-browser parser on the VPS (parser/, scripts/beget-parser-setup.sh); unset = disabled
      - key: PARSER_URL
        sync: false
      - key: PARSER_TOKEN
        sync: false
