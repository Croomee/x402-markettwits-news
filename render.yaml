services:
  - type: web
    name: x402-news
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: node server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PAY_TO_ADDRESS
        sync: false
      - key: X402_NETWORK
        value: eip155:8453
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: PRICE
        value: "$0.003"
      - key: INGEST_TOKEN
        generateValue: true
